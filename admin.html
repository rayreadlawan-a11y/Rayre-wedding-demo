<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAYRE | Private Guest Dashboard</title><style>body{font:15px system-ui;background:#f7f2e8;color:#493b2d;margin:0;padding:24px}main{max-width:950px;margin:auto}h1{font:normal 42px Georgia;color:#99743b}input,button{padding:12px;margin:6px 0;border:1px solid #c8b38b;border-radius:4px;font:inherit}button{background:#a98649;color:white;cursor:pointer}button:disabled{opacity:.5}section{background:white;padding:20px;margin:20px 0;border:1px solid #e4d9c7;border-radius:8px}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats div{background:#f7f2e8;padding:20px;flex:1;min-width:120px}strong{display:block;font-size:28px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left} .scroll{overflow:auto}#app{display:none}#status{white-space:pre-wrap}</style></head><body><main><h1>RAYRE Guest Dashboard</h1><p>Private management · Jeremy & Maria</p><section id="login"><h2>Admin sign in</h2><form id="loginForm"><input type="email" id="email" placeholder="Admin email" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit">Sign in</button></form></section><section id="app"><button id="refresh">Refresh</button> <button id="export">Export CSV</button> <button id="logout">Sign out</button><div class="stats"><div>Confirmed RSVPs<strong id="yes">0</strong></div><div>Declined RSVPs<strong id="no">0</strong></div><div>Total attending<strong id="total">0</strong></div></div><div class="scroll"><table><thead><tr><th>Name</th><th>Response</th><th>Guests</th><th>Message</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="status" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.RAYRE_CONFIG||{}, db=cfg.url&&cfg.anonKey&&window.supabase?window.supabase.createClient(cfg.url,cfg.anonKey):null;
const $=id=>document.getElementById(id);let entries=[];
function csvSafe(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
async function refresh(){if(!db)return;const {data,error}=await db.from('rsvps').select('name,attendance,guest_count,message,created_at').eq('event_slug','jeremy-maria').order('created_at',{ascending:false});if(error){$('status').textContent='Cannot read guest list. Check admin access policies.';return}entries=data||[];$('yes').textContent=entries.filter(x=>x.attendance==='Yes').length;$('no').textContent=entries.filter(x=>x.attendance==='No').length;$('total').textContent=entries.reduce((a,x)=>a+(x.attendance==='Yes'?x.guest_count:0),0);$('rows').replaceChildren();for(const e of entries){const tr=document.createElement('tr');for(const val of [e.name,e.attendance,e.guest_count,e.message,new Date(e.created_at).toLocaleString()]){const td=document.createElement('td');td.textContent=String(val??'');tr.appendChild(td)}$('rows').appendChild(tr)}$('status').textContent=entries.length+' responses loaded.'}
async function update(){if(!db){$('status').textContent='Configure config.js first.';return}const {data:{user}}=await db.auth.getUser();if(!user){$('login').style.display='block';$('app').style.display='none';return}const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){$('status').textContent='This account is not authorized as an admin.';$('app').style.display='none';$('login').style.display='block';return}$('login').style.display='none';$('app').style.display='block';await refresh()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db){$('status').textContent='Configure config.js first.';return}const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('status').textContent='Sign in failed. Check your credentials.';return}$('password').value='';await update()});
$('refresh').onclick=refresh;$('logout').onclick=async()=>{await db.auth.signOut();entries=[];await update()};$('export').onclick=()=>{const cols=['name','attendance','guest_count','message','created_at'];const content=[cols.join(','),...entries.map(e=>cols.map(k=>csvSafe(e[k])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='jeremy-maria-rsvps.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};update();
</script></body></html>
