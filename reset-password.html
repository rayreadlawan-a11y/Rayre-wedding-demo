
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAYRE | Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f2e8;
      color: #4a4035;
      margin: 0;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      margin: 70px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px #00000012;
    }
    h1 { color: #a88749; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 6px;
    }
    input { border: 1px solid #c9bea7; }
    button {
      background: #a88749;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #message { line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>RAYRE Digital Invitations</h1>
    <h2>Reset Admin Password</h2>
    <p id="message">Verifying recovery link...</p>

    <form id="resetForm" hidden>
      <input id="password" type="password"
        placeholder="New password"
        minlength="12" required>
      <input id="confirm" type="password"
        placeholder="Confirm new password"
        minlength="12" required>
      <button id="save" type="submit">
        Save New Password
      </button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const save = document.getElementById("save");

    async function init() {
      const config = window.RAYRE_CONFIG;
      if (!config?.url || !config?.anonKey) {
        message.textContent = "Configuration missing.";
        return;
      }

      const client = window.supabase.createClient(
        config.url, config.anonKey,
        { auth: { detectSessionInUrl: true } }
      );

      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.slice(1));

      if (params.get("error") || hash.get("error")) {
        message.textContent =
          "Recovery link expired or invalid. Request a new email.";
        return;
      }

      try {
        const tokenHash = params.get("token_hash");
        const type = params.get("type");

        if (tokenHash && type === "recovery") {
          const { error } = await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          if (error) throw error;
        } else {
          const code = params.get("code");
          if (code) {
            const { error } =
              await client.auth.exchangeCodeForSession(code);
            if (error) throw error;
          }
        }

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        const recoveryLink =
          (tokenHash && type === "recovery") ||
          params.has("code") ||
          hash.get("type") === "recovery";

        if (!data.session || !recoveryLink) {
          message.textContent =
            "Open this page using a fresh password recovery email.";
          return;
        }

        message.textContent = "Enter your new admin password.";
        form.hidden = false;

        form.addEventListener("submit", async (event) => {
          event.preventDefault();

          const password =
            document.getElementById("password").value;
          const confirm =
            document.getElementById("confirm").value;

          if (password !== confirm) {
            message.textContent = "Passwords do not match.";
            return;
          }

          save.disabled = true;
          const { error } = await client.auth.updateUser({
            password
          });

          if (error) {
            message.textContent = error.message;
            save.disabled = false;
            return;
          }

          await client.auth.signOut();
          form.hidden = true;
          message.textContent =
            "Password updated! Open the Admin Dashboard and sign in.";
        });
      } catch (error) {
        message.textContent =
          "Recovery failed: " + error.message;
      }
    }

    init();
  </script>
</body>
</html>
